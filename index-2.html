/* Disposition : barre latérale (nations + outils) à gauche, zone de travail à droite, fiche ouverte dans un tiroir. Sur tablette étroite la barre devient un menu. */
:root{
  --bg:#edeff3; --surface:#fbfbfd; --surface2:#e3e6ee; --ink:#1b1f2e; --muted:#5d6479; --line:#cfd3df;
  --accent:#3d4fb8; --accent-ink:#ffffff; --accent-soft:#dde1f6;
  --ok:#1f7a4d; --ok-soft:#d8efe2; --warn:#8a5a00; --warn-soft:#f6e7c4; --bad:#b3261e; --bad-soft:#f8dcd9;
  --shadow:0 10px 40px rgba(20,25,50,.22);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1a1e2a; --surface2:#242938; --ink:#e8eaf2; --muted:#98a0b8; --line:#333950;
  --accent:#8c9cf5; --accent-ink:#12141c; --accent-soft:#2a3157;
  --ok:#6fd0a0; --ok-soft:#17382a; --warn:#e5b95a; --warn-soft:#3d3014; --bad:#f08b83; --bad-soft:#43201d;
  --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1a1e2a; --surface2:#242938; --ink:#e8eaf2; --muted:#98a0b8; --line:#333950;
  --accent:#8c9cf5; --accent-ink:#12141c; --accent-soft:#2a3157;
  --ok:#6fd0a0; --ok-soft:#17382a; --warn:#e5b95a; --warn-soft:#3d3014; --bad:#f08b83; --bad-soft:#43201d;
  --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
#root{height:100%}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:.04em;padding:2px 8px 10px}
.brand small{display:block;font:600 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.navlabel{font:700 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 8px 2px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:42px;padding:6px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.nav:hover{background:var(--surface2)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav span:first-child{min-width:0;overflow-wrap:anywhere}
.count{font:600 .8rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.badge{min-width:24px;text-align:center;padding:0 7px;border-radius:99px;background:var(--bad);color:var(--surface);font:700 .8rem/1.5 var(--f-body)}
.addrow{display:flex;gap:6px;padding:4px 2px}
.main{overflow:auto;min-width:0}
.mi{max-width:1100px;margin:0 auto;padding-block:22px 80px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.topbar{display:none}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{font-size:1.7rem}
.namein{font:700 1.6rem var(--f-display);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 8px;min-width:0;flex:1 1 220px}
.namein:hover{border-color:var(--line)}
.namein:focus{background:var(--surface);border-color:var(--accent);outline:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:transparent;padding:10px 16px;min-height:44px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar>*{min-width:0}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
select{width:auto;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;line-height:1.45;min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:2px 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-name{font-family:var(--f-display);font-size:1.08rem;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:1px 9px;border-radius:99px;background:var(--surface2);font-size:.82rem;font-weight:600}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--muted);font-size:.82rem}
.excerpt{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.group h3{font-size:1.05rem;margin:6px 0 10px;display:flex;gap:8px;align-items:baseline}
.group{margin-bottom:10px}
.empty{padding:30px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.info{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.item{display:flex;gap:6px;align-items:center}
.item input{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tile b{display:block;font:700 1.8rem var(--f-display);font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column}
.log div{display:flex;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.log time{flex:0 0 150px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.log span{min-width:0;overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.dh h2{font-size:1.25rem;min-width:0;overflow-wrap:anywhere}
.db{flex:1;overflow:auto;padding:16px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.df{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.df .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lab{font:700 .75rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;gap:6px;align-items:center}
.sec-h input{font-weight:700;flex:1}
.subn{border-left:4px solid var(--accent)}
.toggle{display:flex;gap:8px;align-items:center;min-height:40px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.toggle.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.refs{display:flex;gap:8px;flex-wrap:wrap}
.ref{display:flex;gap:6px;align-items:center;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:.92rem}
.ref.on{border-color:var(--accent);background:var(--accent-soft)}
.ref input{accent-color:var(--accent)}
.errs{padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);display:flex;flex-direction:column;gap:2px}
.errs b{font-size:.85rem}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.sr{position:absolute;left:-9999px}
.field>label.toggle{text-transform:none;letter-spacing:0;font:inherit;color:var(--ink)}
.field>label.toggle.on{color:var(--ok);font-weight:700}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.scopeopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.scopeopt span{display:flex;flex-direction:column}
.scopeopt.on{border-color:var(--accent);background:var(--accent-soft)}
.scopeopt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.sync{font-size:.8rem;padding:0 8px 8px;color:var(--muted)}
.sync::before{content:"●";margin-right:6px}
.sync.on{color:var(--ok)}
.sync.error,.sync.readonly,.sync.slow{color:var(--warn)}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.split.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.form{display:flex;flex-direction:column;gap:14px;min-width:0}
.drawer.wide{width:min(1180px,100%)}
.sidep{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;align-self:start;max-height:calc(100vh - 150px);overflow:auto;min-width:0}
.sidesec{padding:8px 10px;border-radius:8px;background:var(--surface2);display:flex;flex-direction:column;gap:2px}
.sidesec.hit{outline:2px solid var(--warn);background:var(--warn-soft)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.eitem{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--bad);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.eitem strong{color:var(--bad)}
.eitem em{color:var(--muted)}
.flash{outline:3px solid var(--bad);outline-offset:3px;border-radius:10px;animation:fl 1s ease 3}
@keyframes fl{50%{outline-color:transparent}}
.erow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.erow:hover{border-color:var(--accent)}
.ebody{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ebody p{margin:0;overflow-wrap:anywhere}
.quote{font-style:italic;color:var(--muted)}
.eref{min-width:0;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:8px;background:var(--surface2)}
.eact{display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.split.two{grid-template-columns:minmax(0,1fr)}.sidep{position:static;max-height:none;order:-1}}
@media (max-width:760px){.erow{grid-template-columns:minmax(0,1fr)}.eact{flex-direction:row;flex-wrap:wrap}}
@media (max-width:900px){
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .topbar b{font:700 1.3rem var(--f-display);letter-spacing:.04em}
  .app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100%}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0;z-index:20;width:min(320px,88%);box-shadow:var(--shadow)}
  .main{overflow:visible}
  .log time{flex-basis:110px}
}
@media (prefers-reduced-motion:no-preference){.card,.btn,.nav{transition:background .12s,border-color .12s}}
</style>

var memory=null;

      if(changed.length||gone.length){setStatus("saving");slog("envoi : "+changed.length+" à écrire, "+gone.length+" à supprimer")}
      for(var i=0;i<changed.length;i++){

        delete SYNC.gone[p];
      }
      for(var j=0;j<gone.length;j++){
        try{await withTimeout(DBN.doc(gone[j]).delete(),20000,"suppression")}catch(e){slog("ÉCHEC suppression "+gone[j]+" : "+errTxt(e));throw e}
        slog("supprimé "+gone[j]);

    S.nations=S.nations.filter(function(n){return !(n.example&&(S.noExamples||!inRemote("nations/"+n.id))&&!used[n.id])});
    var only=S.fiches.filter(function(f){return !inRemote("fiches/"+f.id)});
    only.forEach(function(f){affs(f).forEach(function(v){if(S.lists.affinite.indexOf(v)<0)S.lists.affinite.push(v)});LISTS.forEach(function(l){if(l[0]==="affinite")return;var v=f[l[0]];if(v&&S.lists[l[0]].indexOf(v)<0)S.lists[l[0]].push(v)})});
    if(only.length)note=only.length+(only.length>1?" fiches de cet appareil ont été ajoutées":" fiche de cet appareil a été ajoutée")+" à ton compte.";
    if(V.nation!=="all"&&!S.nations.some(function(n){return n.id===V.nation}))V.nation="all";
  }
  sortNations();
  setStatus("on");
  if(note)V.syncNote=note;
  persist();
  render();
}
async function startSync(){
  if(SYNC.starting||SYNC.inited)return;
  SYNC.starting=true;
  slog("lecture des données du compte…");
  SYNC.detail="lecture 0/4";refreshStatus();
  try{
    var got=0;
    var tr=function(p){return p.then(function(r){got++;SYNC.detail="lecture "+got+"/4";refreshStatus();return r})};
    var rs=await Promise.all([tr(DBN.collection("nations").get()),tr(DBN.collection("fiches").get()),tr(DBN.doc("meta/lists").get()),tr(DBN.doc("meta/log").get())]);
    rs[0].docs.forEach(function(d){applyRemote("nations/"+d.id,d.data())});
    rs[1].docs.forEach(function(d){applyRemote("fiches/"+d.id,d.data())});
    if(rs[2].exists)applyRemote("meta/lists",rs[2].data());
    if(rs[3].exists)applyRemote("meta/log",rs[3].data());
  }catch(e){
    SYNC.starting=false;slog("ERREUR de lecture : "+errTxt(e));setStatus("error",e);
    if(!(e&&e.code==="invalid_argument")){clearTimeout(SYNC.retryT);SYNC.retryT=setTimeout(startSync,8000)}
    return;
  }
  SYNC.detail="";
  slog("lecture ok : "+Object.keys(SYNC.meta).length+" documents sur le compte");
  afterReady();
  SYNC.starting=false;
  var errH=function(e){slog("ERREUR de suivi : "+errTxt(e));setStatus("error",e)};
  try{
    DBN.collection("nations").onSnapshot(onColl("n","nations/"),errH);
    DBN.collection("fiches").onSnapshot(onColl("f","fiches/"),errH);
    DBN.doc("meta/lists").onSnapshot(onDoc("m","meta/lists"),errH);
    DBN.doc("meta/log").onSnapshot(onDoc("l","meta/log"),errH);
  }catch(e){setStatus("error",e)}
}
async function connect(){
  if(SYNC.connecting)return;
  SYNC.connecting=true;SYNC.inited=false;SYNC.starting=false;
  setStatus("connecting");SYNC.detail="accès aux données";refreshStatus();
  clearTimeout(SYNC.slowT);
  SYNC.slowT=setTimeout(function(){if(!SYNC.inited&&SYNC.status==="connecting")setStatus("slow")},12000);
  try{
    var PM=await window.claude.use("permissions");
    if(PM){
      var st=await PM.state("db");
      SYNC.detail="autorisation : "+st;refreshStatus();slog("autorisation : "+st);
      if(st==="prompt"){SYNC.detail="autorisation demandée, réponds à la fenêtre";refreshStatus();st=(await PM.request(["db"])).db||st}
      if(st==="denied"){SYNC.connecting=false;setStatus("denied");SYNC.detail="";refreshStatus();return}
    }
  }catch(e){}
  try{DBN=await window.claude.use("db")}catch(e){DBN=null}
  SYNC.connecting=false;
  if(!DBN){setStatus("local");SYNC.detail="accès aux données indisponible ici";refreshStatus();return}
  startSync();
}
async function openPerms(){
  try{
    var PM=await window.claude.use("permissions");
    if(PM&&PM.manage){await PM.manage()}
    else throw new Error("none");
  }catch(e){
    V.syncNote="Le panneau d'autorisations ne s'est pas ouvert. Cherche un menu « Autorisations » dans les options de la page (⋮ ou icône d'envoi, en haut à droite).";
    render();return;
  }
  connect();
}

/* ---------- démarrage ---------- */
render();
/* ---------- sauvegarde automatique (version installée) ---------- */
function lastAuto(){try{return +localStorage.getItem("dma-lastbackup")||0}catch(e){return 0}}
function autoBackup(){
  if(HAS_CLAUDE||!STORAGE_OK)return;
  var real=S.fiches.filter(function(f){return !f.example}).length;
  if(!real)return;
  var t=Date.now();
  if(t-lastAuto()<86400000)return;
  try{saveBlob(backupName(),JSON.stringify(S,null,1));localStorage.setItem("dma-lastbackup",String(t));localStorage.setItem("dma-autocopy",JSON.stringify(S));log("Sauvegarde automatique téléchargée");persist()}catch(e){}
}
setTimeout(autoBackup,3000);
setInterval(autoBackup,1800000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)autoBackup()});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}

(function(){
  if(!(window.claude&&window.claude.use)){setStatus("local");return}
  window.claude.use("sample").then(function(x){SAMPLE=x;if(!E)render()},function(){});
  window.claude.use("downloads").then(function(x){DL=x;if(!E)render()},function(){});
  connect();
})();
})();
